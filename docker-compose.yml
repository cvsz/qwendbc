services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - path: configs/.env.example
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MODEL_PATH: /app/models
      CHROMA_DB_PATH: /app/chroma_db
    volumes:
      - model_data:/app/models
      - chroma_data:/app/chroma_db
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  model_data:
  chroma_data:
