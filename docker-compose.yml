services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      MODEL_FILE: ${MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      MODEL_PATH: /app/models
      CHROMA_DB_PATH: /app/chroma_db
      N_THREADS: ${N_THREADS:-4}
      N_BATCH: ${N_BATCH:-512}
      MAX_CONTEXT_LENGTH: ${MAX_CONTEXT_LENGTH:-4096}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - model_data:/app/models
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  model_data:
  chroma_data:
