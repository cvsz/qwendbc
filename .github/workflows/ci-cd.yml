name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Black
        run: black --check backend/app backend/tests
      - name: Flake8
        run: flake8 --config backend/.flake8 backend/app backend/tests
      - name: Mypy
        run: mypy --config-file backend/pyproject.toml backend/app
      - name: Pytest
        env:
          PYTHONPATH: backend
        run: pytest -c backend/pyproject.toml backend/tests --cov=app --cov-report=term-missing
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::frontend/package-lock.json is missing; install is not reproducible'
            npm install --no-audit --no-fund
          fi
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend helpers
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck on tracked shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z -- '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo 'No tracked .sh files to check.'
          else
            shellcheck "${scripts[@]}"
          fi

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [backend, frontend, shellcheck]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
