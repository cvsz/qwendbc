name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been marked stale because it has not had recent activity.
            It will be closed if no further activity occurs.
          close-issue-message: >
            This issue was closed after remaining inactive for 14 days after being marked stale.
          exempt-issue-labels: bug,security,enhancement,pinned
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been marked stale because it has not had recent activity.
            It will be closed if no further activity occurs.
          close-pr-message: >
            This pull request was closed after remaining inactive for 7 days after being marked stale.
          exempt-pr-labels: security,pinned
          operations-per-run: 100
          remove-stale-when-updated: true
