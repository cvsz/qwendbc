name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributor
        uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            👋 Thank you for opening your first issue in QwenDBC. Please include clear reproduction steps and environment details when applicable.
          pr_message: |
            🎉 Thank you for your first pull request to QwenDBC. Please ensure CI passes and documentation is updated for user-facing changes.
