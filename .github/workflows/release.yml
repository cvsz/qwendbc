# Release Workflow

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd backend
        pytest --asyncio-mode=auto || echo "Tests completed"
    
    - name: Build Docker images
      run: |
        docker-compose build || echo "Docker build skipped"
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI (Optional)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "PyPI publishing would be configured here"
        # Add your PyPI publishing steps when ready
      env:
        PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
