name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Validate backend
        env:
          PYTHONPATH: backend
        run: |
          black --check backend/app backend/tests
          flake8 --config backend/.flake8 backend/app backend/tests
          mypy --config-file backend/pyproject.toml backend/app
          pytest -c backend/pyproject.toml backend/tests --cov=app --cov-report=term-missing
          # diskcache is a mandatory llama-cpp-python import-time dependency;
        # AI-DBC never enables LlamaDiskCache and the current advisory has no
          # upstream fix. Keep the exception explicit and review on dependency updates.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-2447
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::frontend/package-lock.json is missing; install is not reproducible'
            npm install --no-audit --no-fund
          fi
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build Docker images
        run: docker compose build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
