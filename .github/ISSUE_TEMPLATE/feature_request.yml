name: Feature request
description: Propose a QwenDBC improvement
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and API/UI impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative designs you considered.
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility considerations
      description: Note network exposure, data handling, model/dependency, or breaking-change implications.
