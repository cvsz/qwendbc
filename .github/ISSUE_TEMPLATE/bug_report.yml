name: Bug report
description: Report a reproducible QwenDBC defect
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or private vulnerability details here; use the security reporting path instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence of commands/actions.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or git SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - Backend / API
        - LLM / model loading
        - RAG / document retrieval
        - Frontend
        - Docker / deployment
        - CI / GitHub Actions
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, Docker, CPU/GPU, and relevant configuration without secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, credentials, prompts, private documents, and other sensitive data.
      render: text
