services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - path: configs/.env.example
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      TRUST_PROXY_HEADERS: "true"
      MODEL_PATH: /app/models
      CHROMA_DB_PATH: /app/chroma_db
    volumes:
      - model_data:/app/models
      - chroma_data:/app/chroma_db
    read_only: true
    pids_limit: 512
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: ai-dbc.zeaz.dev", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  open-webui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: configs/.env.example
      - path: .env
        required: false
    environment:
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEBSOCKET_SUPPORT: "true"
      OPENAI_API_BASE_URLS: http://backend:8000/api/v1
      OPENAI_API_KEYS: ${QWENDBC_ACCESS_TOKEN:-}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:-}
      WEBUI_URL: ${OPENWEBUI_URL:-https://ai-dbc.zeaz.dev}
      CORS_ALLOW_ORIGIN: ${OPENWEBUI_CORS_ALLOW_ORIGIN:-https://ai-dbc.zeaz.dev}
      # Enterprise features
      ENABLE_LDAP: "${OPENWEBUI_ENABLE_LDAP:-false}"
      LDAP_SERVER_URI: "${OPENWEBUI_LDAP_SERVER_URI:-}"
      LDAP_BIND_DN: "${OPENWEBUI_LDAP_BIND_DN:-}"
      LDAP_BIND_PASSWORD: "${OPENWEBUI_LDAP_BIND_PASSWORD:-}"
      LDAP_USER_SEARCH_BASE: "${OPENWEBUI_LDAP_USER_SEARCH_BASE:-}"
      LDAP_GROUP_SEARCH_BASE: "${OPENWEBUI_LDAP_GROUP_SEARCH_BASE:-}"
      OAUTH_PROVIDERS: "${OPENWEBUI_OAUTH_PROVIDERS:-}"
      ENABLE_ADMIN_EXPORT: "true"
      ENABLE_ADMIN_CHAT_ACCESS: "true"
      DEFAULT_USER_ROLE: "${OPENWEBUI_DEFAULT_USER_ROLE:-user}"
      ENABLE_RAG: "true"
      RAG_EMBEDDING_ENGINE: "${OPENWEBUI_RAG_EMBEDDING_ENGINE:-ollama}"
      RAG_EMBEDDING_MODEL: "${OPENWEBUI_RAG_EMBEDDING_MODEL:-nomic-embed-text}"
      ENABLE_WEB_SEARCH: "${OPENWEBUI_ENABLE_WEB_SEARCH:-true}"
      WEB_SEARCH_ENGINE: "${OPENWEBUI_WEB_SEARCH_ENGINE:-searxng}"
      SEARXNG_BASE_URL: "${OPENWEBUI_SEARXNG_BASE_URL:-}"
      ENABLE_FUNCTIONS: "true"
      ENABLE_MODEL_FILTER: "true"
      WEBUI_NAME: "${OPENWEBUI_WEBUI_NAME:-AI-DBC}"
      WEBUI_FAVICON_URL: "${OPENWEBUI_WEBUI_FAVICON_URL:-}"
      DEFAULT_LOCALE: "${OPENWEBUI_DEFAULT_LOCALE:-en-US}"
      DEFAULT_THEME: "${OPENWEBUI_DEFAULT_THEME:-system}"
      ENABLE_AUDIT_LOG: "${OPENWEBUI_ENABLE_AUDIT_LOG:-true}"
      ENABLE_EVALUATION_ARENA: "${OPENWEBUI_ENABLE_EVALUATION_ARENA:-false}"
      ENABLE_COMMUNITY_SHARING: "${OPENWEBUI_ENABLE_COMMUNITY_SHARING:-false}"
      ENABLE_MESSAGE_RATING: "true"
      ENABLE_CODE_EXECUTION: "${OPENWEBUI_ENABLE_CODE_EXECUTION:-false}"
      ENABLE_FILE_UPLOAD: "true"
      MAX_FILE_SIZE: "${OPENWEBUI_MAX_FILE_SIZE:-50MB}"
      ENABLE_IMAGE_GENERATION: "${OPENWEBUI_ENABLE_IMAGE_GENERATION:-false}"
      ENABLE_RATE_LIMIT: "${OPENWEBUI_ENABLE_RATE_LIMIT:-true}"
      RATE_LIMIT_REQUESTS: "${OPENWEBUI_RATE_LIMIT_REQUESTS:-100}"
      RATE_LIMIT_WINDOW: "${OPENWEBUI_RATE_LIMIT_WINDOW:-60}"
    volumes:
      - open_webui_data:/app/backend/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    pids_limit: 256
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755
      - /var/log/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  nginx-proxy:
    image: nginx:1.29-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certs/letsencrypt:/etc/letsencrypt:ro
      - ./certs/webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/log/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev

  certbot:
    image: certbot/certbot:v3.1.0
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/webroot:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot
      --email admin@zeaz.dev
      --agree-tos --no-eff-email
       -d ai-dbc.zeaz.dev
    profiles:
      - certbot

volumes:
  model_data:
  chroma_data:
  open_webui_data:
